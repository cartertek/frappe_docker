name: Cartertek / Build Frappe Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Primary image tag. develop also publishes latest; release tags also publish major aliases.
        required: false
        default: develop
      frappe_ref:
        description: Legacy Frappe branch input; Frappe source is pinned by FRAPPE_COMMIT in the layered image build.
        required: false
        default: develop
      push:
        description: Publish image to GHCR.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cartertek-frappe-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/cartertek/frappe
  FRAPPE_REF: "${{ github.event.inputs.frappe_ref || 'develop' }}"
  PRIMARY_TAG: "${{ github.event.inputs.image_tag || 'develop' }}"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check image build inputs
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - apps.json
              - images/layered/**
              - resources/core/**
              - resources/cartertek/**
              - .github/workflows/cartertek-build-image.yml

  build:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          primary="${PRIMARY_TAG}"
          tags=("${IMAGE_NAME}:${primary}")
          if [[ "$primary" == "develop" ]]; then
            tags+=("${IMAGE_NAME}:latest")
          elif [[ "$primary" =~ ^v([0-9]+)\. ]]; then
            major="${BASH_REMATCH[1]}"
            tags+=("${IMAGE_NAME}:v${major}" "${IMAGE_NAME}:version-${major}")
          fi
          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            FRAPPE_COMMIT=80d6f8767113e2d16f8a451367e387d9c8469c43
            FRAPPE_PIN_REF=cartertek-known-good-20260701
          load: true
          platforms: linux/amd64
          secret-files: |
            apps_json=apps.json
          tags: local/cartertek-frappe:${{ github.run_id }}-${{ github.run_attempt }}

      - name: Smoke test image contents
        run: |
          docker run --rm --entrypoint bash local/cartertek-frappe:${{ github.run_id }}-${{ github.run_attempt }} -lc "ls -1 /home/frappe/frappe-bench/apps && test -d /home/frappe/frappe-bench/apps/frappe && test -d /home/frappe/frappe-bench/apps/erpnext && test -d /home/frappe/frappe-bench/apps/hrms && test -d /home/frappe/frappe-bench/apps/crm && test -d /home/frappe/frappe-bench/apps/sales_engagement_intelligence && cd /home/frappe/frappe-bench && bench version"

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            FRAPPE_COMMIT=80d6f8767113e2d16f8a451367e387d9c8469c43
            FRAPPE_PIN_REF=cartertek-known-good-20260701
          platforms: linux/amd64
          push: true
          secret-files: |
            apps_json=apps.json
          tags: ${{ steps.tags.outputs.tags }}
