name: Cartertek / Build Frappe Image

on:
  pull_request:
    branches:
      - main
    paths:
      - apps.json
      - images/layered/**
      - .github/workflows/cartertek-build-image.yml
  push:
    branches:
      - main
    paths:
      - apps.json
      - images/layered/**
      - .github/workflows/cartertek-build-image.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: Primary image tag. develop also publishes latest; v17.x.y also publishes v17 and version-17.
        required: false
        default: develop
      frappe_ref:
        description: Frappe ref used for layered base/build images and Frappe source.
        required: false
        default: develop
      push:
        description: Publish image to GHCR.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cartertek-frappe-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/cartertek/frappe
  FRAPPE_REF: develop
  PRIMARY_TAG: develop

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          primary="${PRIMARY_TAG}"
          tags=("${IMAGE_NAME}:${primary}")

          if [[ "$primary" == "develop" ]]; then
            tags+=("${IMAGE_NAME}:latest")
          elif [[ "$primary" =~ ^v([0-9]+)\. ]]; then
            major="${BASH_REMATCH[1]}"
            tags+=("${IMAGE_NAME}:v${major}" "${IMAGE_NAME}:version-${major}")
          fi

          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
          load: true
          platforms: linux/amd64
          secrets: |
            id=apps_json,src=apps.json
          tags: local/cartertek-frappe:${{ github.run_id }}-${{ github.run_attempt }}

      - name: Smoke test image contents
        run: |
          docker run --rm --entrypoint bash local/cartertek-frappe:${{ github.run_id }}-${{ github.run_attempt }} -lc "test -d /home/frappe/frappe-bench/apps/frappe && test -d /home/frappe/frappe-bench/apps/erpnext && test -d /home/frappe/frappe-bench/apps/hrms && test -d /home/frappe/frappe-bench/apps/sales_engagement_intelligence && cd /home/frappe/frappe-bench && bench version"
